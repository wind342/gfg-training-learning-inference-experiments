name: Refresh TLIR evidence-linked eight-page PDF
on:
  push:
    branches: [tlir-cvpr2027-format]
    paths:
      - '.github/workflows/refresh-tlir-evidence-link.yml'
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Compile original TLIR LaTeX with evidence statement
        uses: xu-cheng/latex-action@v3
        with:
          root_file: main.tex
          working_directory: manuscripts/tlir_cvpr2027
          args: -pdf -interaction=nonstopmode -halt-on-error -file-line-error
      - name: Validate and package paper
        run: |
          set -euo pipefail
          cd manuscripts/tlir_cvpr2027
          test -s main.pdf
          grep -Eq 'Output written on main\.pdf \(8 pages,' main.log
          grep -Fq 'https://github.com/wind342/tlir-research-evidence' main.tex
          grep -Fq 'machine-readable format for rapid machine-assisted auditing' main.tex
          grep -q 'figure1_tlir_closed_loop.png' main.tex
          grep -q 'figure2_experimental_14panel.png' main.tex
          grep -q 'figure2_six_system_evidence.pdf' main.tex
          cp main.pdf TLIR_CVPR2027_Submission_Ready.pdf
          rm -f TLIR_CVPR2027_Official_Submission_Project.zip
          zip -q -r TLIR_CVPR2027_Official_Submission_Project.zip README.md main.tex main.bib main.bbl preamble.tex cvpr.sty ieeenat_fullname.bst figures
      - uses: actions/upload-artifact@v4
        with:
          name: TLIR-CVPR2027-Evidence-Linked-Eight-Page-Paper
          path: |
            manuscripts/tlir_cvpr2027/TLIR_CVPR2027_Submission_Ready.pdf
            manuscripts/tlir_cvpr2027/TLIR_CVPR2027_Official_Submission_Project.zip
          if-no-files-found: error
      - name: Publish PDF and source ZIP
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add manuscripts/tlir_cvpr2027/TLIR_CVPR2027_Submission_Ready.pdf manuscripts/tlir_cvpr2027/TLIR_CVPR2027_Official_Submission_Project.zip
          if ! git diff --cached --quiet; then
            git commit -m "Publish TLIR PDF and source package with auditable evidence repository"
            git push
          fi

name: Build TLIR CVPR PDF
on:
  push:
    branches: [tlir-cvpr2027-format]
    paths:
      - '.github/workflows/build-tlir-cvpr.yml'
      - 'manuscripts/tlir_cvpr2027/main.tex'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - name: Compile manuscript with original figures
        uses: xu-cheng/latex-action@v3
        with:
          root_file: main.tex
          working_directory: manuscripts/tlir_cvpr2027
          args: -pdf -interaction=nonstopmode -halt-on-error -file-line-error
      - name: Inspect and publish compiled paper
        run: |
          test -s manuscripts/tlir_cvpr2027/main.pdf
          cp manuscripts/tlir_cvpr2027/main.pdf manuscripts/tlir_cvpr2027/TLIR_CVPR2027_Submission_Ready.pdf
      - uses: actions/upload-artifact@v4
        with:
          name: TLIR-CVPR2027-compiled-PDF
          path: manuscripts/tlir_cvpr2027/TLIR_CVPR2027_Submission_Ready.pdf
          if-no-files-found: error
      - name: Update PDF in manuscript directory
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add manuscripts/tlir_cvpr2027/TLIR_CVPR2027_Submission_Ready.pdf
          if ! git diff --cached --quiet; then
            git commit -m "Recompile TLIR CVPR paper PDF with approved conclusion"
            git push
          fi

name: Build TLIR CVPR eight-page submission
on:
  push:
    branches: [tlir-cvpr2027-format]
    paths:
      - '.github/workflows/build-tlir-cvpr-8page.yml'
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Compile with both new figures and original six-system matrix
        uses: xu-cheng/latex-action@v3
        with:
          root_file: main.tex
          working_directory: manuscripts/tlir_cvpr2027
          args: -pdf -interaction=nonstopmode -halt-on-error -file-line-error
      - name: Verify eight pages and package source
        run: |
          set -euo pipefail
          cd manuscripts/tlir_cvpr2027
          test -s main.pdf
          pages=$(pdfinfo main.pdf | awk '/^Pages:/ {print $2}')
          echo "Compiled pages: $pages"
          test "$pages" -eq 8
          grep -q 'figure1_tlir_closed_loop.png' main.tex
          grep -q 'figure2_experimental_14panel.png' main.tex
          grep -q 'figure2_six_system_evidence.pdf' main.tex
          test -s figures/figure1_tlir_closed_loop.png
          test -s figures/figure2_experimental_14panel.png
          test -s figures/figure2_six_system_evidence.pdf
          cp main.pdf TLIR_CVPR2027_Submission_Ready.pdf
          rm -f TLIR_CVPR2027_Official_Submission_Project.zip
          zip -q -r TLIR_CVPR2027_Official_Submission_Project.zip README.md main.tex main.bib main.bbl preamble.tex cvpr.sty ieeenat_fullname.bst figures
      - name: Upload verified outputs
        uses: actions/upload-artifact@v4
        with:
          name: TLIR-CVPR2027-Eight-Page-PDF-And-Sources
          path: |
            manuscripts/tlir_cvpr2027/TLIR_CVPR2027_Submission_Ready.pdf
            manuscripts/tlir_cvpr2027/TLIR_CVPR2027_Official_Submission_Project.zip
          if-no-files-found: error
      - name: Commit compiled PDF and package to manuscript branch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add manuscripts/tlir_cvpr2027/TLIR_CVPR2027_Submission_Ready.pdf manuscripts/tlir_cvpr2027/TLIR_CVPR2027_Official_Submission_Project.zip
          if ! git diff --cached --quiet; then
            git commit -m "Publish verified eight-page CVPR paper PDF and source package"
            git push
          fi

[build-system]
requires = ["hatchling>=1.27,<2"]
build-backend = "hatchling.build"

[project]
name = "generation-relation-core"
version = "3.0.0"
description = "Source information continuity and generation-relation reference implementation"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
  "jsonschema>=4.23,<5",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.3,<10",
]
signal = [
  "numpy>=2.1,<3",
]
svg = [
  "fonttools>=4.55,<5",
  "numpy>=2.1,<3",
  "pillow>=11,<13",
]
document = [
  "lxml>=5.3,<7",
]
experiments = [
  "fonttools>=4.55,<5",
  "lxml>=5.3,<7",
  "numpy>=2.1,<3",
  "pillow>=11,<13",
]

[tool.hatch.build.targets.wheel]
packages = ["src/generation_relation_core", "compat"]

[tool.pytest.ini_options]
addopts = "-ra"
testpaths = ["tests"]
pythonpath = ["src", "."]
